# Run everything with:  docker-compose up --build
# Backend  -> http://localhost:5000   (Flask API, direct)
# Frontend -> http://localhost:3000   (React UI; nginx proxies /api -> backend)

services:
  backend:
    build: ./backend
    container_name: taskflow-backend
    ports:
      # Override the host port if 5000 is taken (macOS AirPlay Receiver uses it):
      #   BACKEND_PORT=5001 docker-compose up --build
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      # Allow direct browser calls from the UI origin, in addition to the nginx proxy.
      - CORS_ORIGINS=http://localhost:3000
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: taskflow-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
