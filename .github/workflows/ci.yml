name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-lint-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check . && ruff format --check .
        working-directory: backend
      - run: pytest
        working-directory: backend

  frontend-tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  compose-smoke:
    # The real test: build both images the way a reviewer would and hit the API.
    runs-on: ubuntu-latest
    needs: [backend-lint-and-tests, frontend-tests-and-build]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - run: ./scripts/smoke.sh http://localhost:5000
      - run: curl -sf http://localhost:3000/ | grep -q "TaskFlow"
      - run: curl -sf http://localhost:3000/api/tasks/stats
      - if: always()
        run: docker compose logs && docker compose down
