server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker healthcheck target; kept out of the access log.
    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The browser calls /api/tasks; nginx forwards it to the Flask container
    # as /tasks over the compose network. Keeps CORS out of the picture entirely.
    location /api/ {
        # Resolve the service name at request time (Docker's embedded DNS), so a
        # restarted backend with a new IP keeps working without restarting nginx.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:5000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
